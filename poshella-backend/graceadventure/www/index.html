<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Grace's Amazing Adventure</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #0a0a12; color: #fff; font-family: sans-serif; overflow: hidden; touch-action: none; }
    #game-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
    .hud-title { font-size: 18px; font-weight: 900; color: #ffbc00; text-shadow: 0 2px 4px #000; }
    .hud-score { font-size: 28px; font-weight: 800; text-shadow: 0 2px 4px #000; }
    #char-menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; background: rgba(10, 10, 18, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    #char-menu h1 { font-size: 24px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
    .char-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 340px; margin-bottom: 25px; }
    .char-card { background: #161625; border: 2px solid #2a2a40; border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; }
    .char-card.selected { border-color: #ffbc00; background: #252540; box-shadow: 0 0 15px rgba(255, 188, 0, 0.4); }
    .char-card h3 { font-size: 13px; margin-top: 8px; color: #ddd; }
    .char-avatar { width: 45px; height: 45px; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    #play-btn { width: 100%; max-width: 340px; padding: 16px; background: #ffbc00; color: #000; font-size: 18px; font-weight: 900; border: none; border-radius: 30px; text-transform: uppercase; cursor: pointer; }
  </style>
  <script src="cordova.js"></script>
  <script src="js/three.min.js"></script>
</head>
<body>
  <div id="game-container"></div>
  <div id="ui-layer">
    <div class="hud-title">GRACE'S AMAZING ADVENTURE</div>
    <div class="hud-score" id="score-display">0m</div>
  </div>
  <div id="char-menu">
    <h1>Select Runner</h1>
    <div class="char-grid">
      <div class="char-card selected" onclick="selectChar('grace', this)">
        <div class="char-avatar" style="background: #1d3557; color: #fff;">GB</div>
        <h3>Grace Bond</h3>
      </div>
      <div class="char-card" onclick="selectChar('shadow', this)">
        <div class="char-avatar" style="background: #e0e0e0; color: #000;">AS</div>
        <h3>Aim Shadow</h3>
      </div>
      <div class="char-card" onclick="selectChar('best', this)">
        <div class="char-avatar" style="background: #ffffff; color: #000;">TB</div>
        <h3>The Best</h3>
      </div>
      <div class="char-card" onclick="selectChar('michelle', this)">
        <div class="char-avatar" style="background: #4a4e69; color: #fff;">AM</div>
        <h3>Aim Michelle</h3>
      </div>
    </div>
    <button id="play-btn" onclick="startGame()">START RUN</button>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
